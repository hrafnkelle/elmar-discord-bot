[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elmar-bot"
version = "0.1.0"
description = "Icelandic amateur radio callsign helper for Discord"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["discord.py==2.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
elmar = "elmar.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
